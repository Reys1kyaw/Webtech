            <h2>Send Me a Message</h2>
            <form>

                <input 
                type="text"
                id="name"
                name="name"

                id="name"

                >

               <br>
               <input 
               type="text"
               id="subject"
               name="subject"
               placeholder="Enter subject"
               >
               <br><br>
               <label for="message">Message:</label>
               <br>
               <textarea 
               name="message" 
               id="massage"
               rows="6"
               cols="40"
               placeholder="Write your message here"
               ></textarea>

            <br><br>
            <button type="submit">Send Message</button>
        
          </form>
